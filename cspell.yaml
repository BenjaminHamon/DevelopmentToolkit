# cspell:words pycache pytest venv

---

ignorePaths:
  - ".git/**"
  - ".venv-automation/**"
  - ".venv/**"
  - "**/__pycache__/**"
  - "**/.pytest_cache/**"
  - "**/*.egg-info/**"
  - "Artifacts/**"
  - "Sources/*/build/**"

words:
  - benjaminhamon
  - bhamon
  - hamon

enableFiletypes:
  - toml
