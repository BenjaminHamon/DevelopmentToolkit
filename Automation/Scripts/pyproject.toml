# cspell:words asyncio pylint pytest setuptools

[build-system]
requires = [ "setuptools >= 64" ]
build-backend = "setuptools.build_meta"

[project]
name = "automation-scripts"
version = "3.1.0+development"
description = "Automation scripts for the local project"
requires-python = ">= 3.9"

dependencies = [
    "bhamon-development-toolkit[python] == 3.1.0+development",
    "mockito ~= 1.5.4",
]

[project.scripts]
automation = "automation_scripts.run_command:main"
