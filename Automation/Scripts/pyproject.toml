# cspell:words asyncio pylint pytest setuptools

[build-system]
requires = [ "setuptools >= 64" ]
build-backend = "setuptools.build_meta"

[project]
name = "automation-scripts"
version = "4.0.0+development"
description = "Automation scripts for the local project"
requires-python = ">= 3.9"

dependencies = [
    "bhamon-development-toolkit ~= 3.0.1",
]

[project.optional-dependencies]
dev = [
    "mockito ~= 1.5.0",
    "pylint ~= 3.2.6",
    "pytest ~= 8.3.2",
    "pytest-json ~= 0.4.0",
    "pytest-asyncio ~= 0.24.0",
]

[project.scripts]
automation = "automation_scripts.run_command:main"
