# cspell:words asyncio pyinstaller pylint pytest setuptools

[build-system]
requires = [ "setuptools >= 64" ]
build-backend = "setuptools.build_meta"

[project]
name = "bhamon-development-toolkit"
version = "3.1.0+development"
description = "Toolkit for automating software development tasks"
requires-python = ">= 3.9"

authors = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

maintainers = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = []

[project.optional-dependencies]
all = [

    # Python
    "pyinstaller ~= 6.12.0",
    "pylint ~= 3.3.6",
    "pytest ~= 8.3.5",
    "pytest-asyncio ~= 0.26.0",
    "pytest-json ~= 0.4.0",
    "twine ~= 6.1.0",

]

python = [
    "pyinstaller ~= 6.12.0",
    "pylint ~= 3.3.6",
    "pytest ~= 8.3.5",
    "pytest-asyncio ~= 0.26.0",
    "pytest-json ~= 0.4.0",
    "twine ~= 6.1.0",
]

dev = [
    "mockito ~= 1.5.4",
    "pylint ~= 3.3.6",
    "pytest ~= 8.3.5",
    "pytest-asyncio ~= 0.26.0",
    "pytest-json ~= 0.4.0",
]

[project.urls]
"Source" = "https://github.com/BenjaminHamon/DevelopmentToolkit"

[tool.setuptools]
license-files = [ "../../license.txt" ]
